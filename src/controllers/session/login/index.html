<div id="loginPage" data-role="page" class="page standalonePage backdropPage debtflixLoginPage" data-backbutton="false" data-backdroptype="splashscreen">
    <div class="debtflixLogin-wrapper">

        <!-- Profile Selection View -->
        <div class="debtflixLogin-profiles visualLoginForm">
            <h1 class="debtflixLogin-heading">${HeaderPleaseSignIn}</h1>
            <div id="divUsers" class="debtflixLogin-profiles-grid itemsContainer vertical-wrap centered"></div>
            <div class="debtflixLogin-actions">
                <button is="emby-button" type="button" class="debtflixLogin-btn-secondary btnManual">
                    <span>${ButtonManualLogin}</span>
                </button>
                <button is="emby-button" type="button" class="debtflixLogin-btn-secondary btnQuick hide">
                    <span>${ButtonUseQuickConnect}</span>
                </button>
                <button is="emby-button" type="button" class="debtflixLogin-btn-secondary btnSelectServer">
                    <span>${ButtonChangeServer}</span>
                </button>
            </div>
        </div>

        <!-- Manual Login Form -->
        <form class="manualLoginForm debtflixLogin-form margin-auto-x hide">
            <h1 class="debtflixLogin-heading">${HeaderPleaseSignIn}</h1>
            <div class="inputContainer">
                <input is="emby-input" type="text" id="txtManualName" required="required" label="${LabelUser}" autocomplete="username" autocapitalize="off" />
            </div>
            <div class="inputContainer">
                <input is="emby-input" id="txtManualPassword" type="password" label="${LabelPassword}" autocomplete="current-password" />
            </div>
            <label class="checkboxContainer">
                <input is="emby-checkbox" type="checkbox" class="chkRememberLogin" checked />
                <span>${RememberMe}</span>
            </label>
            <button is="emby-button" type="submit" class="raised button-submit debtflixLogin-btn-primary block">
                <span>${ButtonSignIn}</span>
            </button>
            <div style="margin-top:.75em;">
                <button is="emby-button" type="button" class="debtflixLogin-btn-secondary cancel block btnCancel">
                    <span>${ButtonCancel}</span>
                </button>
            </div>
            <div style="margin-top:.5em;">
                <button is="emby-button" type="button" class="debtflixLogin-btn-link btnForgotPassword">
                    <span>${ButtonForgotPassword}</span>
                </button>
            </div>
            <div class="loginDisclaimerContainer">
                <div class="loginDisclaimer"></div>
            </div>
        </form>

    </div>
</div>
